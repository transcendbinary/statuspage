<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transcend Binary | Status</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Transcend Binary Status</h1>
<hr>

<h2 style="color: #28a745">Status Page</h2>
<p>Fully Operational</p>

<hr>

<h2 id="origin">
  Origin

</h2>
<p id="originStatus"></p>

<hr>

<h2 id="mainSite">
  Main Site
  <span class="spinner" id="mainSiteSpinner"></span>
</h2>
<p id="mainSiteStatus"></p>

  <hr>

<h2 id="miles">
  Miles
  <span class="spinner" id="milesSpinner"></span>
</h2>
<p id="milesStatus"></p>
  
<hr>

<h2 id="betaSite">
  Beta Site
  <span class="spinner" id="betaSiteSpinner"></span>
</h2>
<p id="betaSiteStatus"></p>

<hr>

<h2 id="cdn">
  CDN
  <span class="spinner" id="cdnSpinner"></span>
</h2>
<p id="cdnStatus"></p>

<hr>

<h2 id="api">
  API
  <span class="spinner" id="apiSpinner"></span>
</h2>
<p id="apiStatus"></p>

<hr>

<h2 id="teespring">
  Main Store (Teespring)
  <span class="spinner" id="teespringSpinner"></span>
</h2>
<p id="teespringStatus"></p>

<hr>

<h2 id="bigCartel">
  Sticker Shop (Big Cartel)
  <span class="spinner" id="bigCartelSpinner"></span>
</h2>
<p id="bigCartelStatus"></p>

<hr>

<script src="script.js"></script>

</body>
</html>
